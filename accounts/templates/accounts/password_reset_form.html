{% extends "base.html" %}
{% block content %}
  <h2>🔐 Forgot Your Password?</h2>
  <p>Enter your email address below and we'll send you instructions for setting a new one.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.email.label_tag }}<br>
    {{ form.email }}
    <br><br>
    <button type="submit" class="btn btn-primary">Send Reset Email</button>
  </form>
{% endblock %}
